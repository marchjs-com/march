name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# March only: the showcase (marchjs.com) is built and checked in its own repository
jobs:
  test:
    runs-on: ubuntu-latest
    # a normal run takes 2–4 minutes; a hang ends here, not after GitHub's six hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node's current LTS
          node-version: 24
      - run: npm ci
      - run: npm run test:all
      - run: npm run size
